name: Feature request
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The SDK reports koldera-core's machine checks and never guesses meaning the document does not state. A request
        that would make it claim a result it cannot know will be declined; a request for better access to evidence for a
        person to review is welcome. Requests for server behaviour belong in koldera-core.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? For an API change, show the call you would write.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I would be willing to send a pull request.
