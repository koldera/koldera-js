name: CI

# The lean per-change gate: one job on the oldest supported runtime plus a newest-runtime test step.
# The wide compatibility matrix lives in matrix.yml and runs only for release tags (release.yml).
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm test:docs
      - run: pnpm test:scripts
      - run: node scripts/check-source-hygiene.mjs
      - name: Install gitleaks (pinned release, SHA-256 checked)
        run: |
          # The gitleaks-action wrapper needs a paid licence for organisations; the plain binary does not.
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Secrets in the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: Secrets in the git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner
      - run: node scripts/check-licences.mjs
      - name: Vendored contracts equal koldera-core at contracts/CORE_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < contracts/CORE_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/CORE_VERSION must hold a 40-character commit id"; exit 1; }
          mkdir core
          raw="https://api.github.com/repos/koldera/koldera-core/contents/contracts"
          files="openapi.yaml document.schema.json problem.schema.json"

          # Public repositories can be read without a token; once koldera-core is public the check is mandatory.
          public=false
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' https://api.github.com/repos/koldera/koldera-core)" = "200" ]; then public=true; fi

          auth=()
          if ! $public; then auth=(-H "Authorization: Bearer $GH_TOKEN"); fi
          readable=true
          for f in $files; do
            code="$(curl -sS -o "core/$f" -w '%{http_code}' -H "Accept: application/vnd.github.raw+json" "${auth[@]}" "$raw/$f?ref=$sha")"
            if [ "$code" != "200" ]; then readable=false; echo "fetching $f returned HTTP $code"; break; fi
          done

          if ! $readable; then
            if $public; then
              echo "::error::koldera-core is public but contracts at $sha could not be fetched"
              exit 1
            fi
            echo "::notice title=Contract check skipped::koldera-core is private and not readable with this workflow's token. The check is enforced once the repository is public."
            exit 0
          fi

          status=0
          for f in $files; do
            if ! diff -u "core/$f" "contracts/$f"; then
              echo "::error::contracts/$f differs from koldera-core at $sha"
              status=1
            fi
          done
          exit $status
      - run: pnpm docs:api
      - name: The API reference was generated
        run: test -s docs/api/index.html
      - name: Package contents
        run: |
          for package in sdk react; do
            (cd "packages/$package" && npm pack --dry-run)
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tests on the newest Node (the full matrix runs at release)
        run: pnpm -r test
